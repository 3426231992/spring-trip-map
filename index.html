<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春游手绘路线图 - 互动版</title>
    <style>
        body { margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; background: #fdf6e3; text-align: center; }
        .map-container { position: relative; display: inline-block; margin-top: 20px; max-width: 100%; }
        /* 这是背景图，建议换成你保存下来的手绘图链接 */
        .map-image { width: 100%; height: auto; display: block; border: 5px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 10px; }
        
        /* 交互热点样式 */
        .spot {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #ff6b6b;
            border-radius: 50%;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        /* 预设三个点位（百分比定位，适应不同手机屏幕） */
        #spot1 { top: 45%; left: 30%; } /* 樱花大道 */
        #spot2 { top: 55%; left: 50%; } /* 野餐区 */
        #spot3 { top: 25%; left: 80%; } /* 观景台 */

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .modal h3 { color: #ff6b6b; margin-top: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        .close-btn { margin-top: 15px; padding: 8px 20px; background: #ff6b6b; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>点击图标查看景点详情</h2>

    <div class="map-container">
        <img src="Gemini_Generated_Image_ngcld3ngcld3ngcl.png" class="map-image" alt="春游地图">
        
        <div class="spot" id="spot1" onclick="showDetail('🌸 樱花大道', '10:00 举行摄影大赛，现场提供免费汉服体验。')"></div>
        <div class="spot" id="spot2" onclick="showDetail('🍱 湖畔野餐区', '12:00 自助野餐开始，每人可领取一份精致餐盒。')"></div>
        <div class="spot" id="spot3" onclick="showDetail('⛰️ 夕阳观景台', '17:30 全体集合拍摄大合照，记录最美日落时刻。')"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="modal">
        <h3 id="modal-title">景点介绍</h3>
        <p id="modal-content">这里是详细内容...</p>
        <button class="close-btn" onclick="closeModal()">我知道了</button>
    </div>

    <script>
        function showDetail(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerText = content;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
