<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>春日漫步·轻量版</title>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #fdf6e3; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #viewport { width: 100vw; height: 100vh; overflow: auto; }
        #panzoom-element { position: relative; display: inline-block; transform-origin: 0 0; }
        .main-map { display: block; width: 100vw; height: auto; }

        /* 点位样式 */
        .poi {
            position: absolute; width: 30px; height: 30px;
            background: rgba(255, 105, 180, 0.7); border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%); cursor: pointer; z-index: 10;
        }

        /* 桃花雨画布 */
        #petalCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        
        /* 简单的信息提示区 */
        #info-bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 15px; border-radius: 20px; font-size: 13px; display: none; z-index: 110; }
    </style>
</head>
<body>

    <div id="info-bar"></div>

    <div id="viewport">
        <div id="panzoom-element">
            <img src="map.jpg" class="main-map">
            <div class="poi" style="top: 55%; left: 34%;" onclick="showTip('樱花大道：点击屏幕上方开始飘雪')"></div>
            <div class="poi" style="top: 72%; left: 16%;" onclick="showTip('起点：翠竹园 (9:30集合)')"></div>
            <div class="poi" style="top: 27%; left: 81%;" onclick="showTip('终点：夕阳观景台')"></div>
        </div>
    </div>

    <canvas id="petalCanvas"></canvas>

    <script>
        // 1. 初始化缩放
        const elem = document.getElementById('panzoom-element');
        const pz = Panzoom(elem, { maxScale: 5, contain: 'outside' });
        elem.parentElement.addEventListener('wheel', pz.zoomWithWheel);

        // 2. 信息提示逻辑
        const infoBar = document.getElementById('info-bar');
        function showTip(msg) {
            infoBar.innerText = msg;
            infoBar.style.display = 'block';
            if(msg.includes('樱花')) startPetals();
            setTimeout(() => infoBar.style.display = 'none', 3000);
        }

        // 3. 原生 Canvas 绘图桃花雨 (无图片版本)
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');
        let petals = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = 5 + Math.random() * 8;
                this.speedY = 1 + Math.random() * 2;
                this.speedX = -1 + Math.random() * 1;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += 0.02;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = "#ffb7c5"; // 桃花粉
                
                // 关键：用绘图路径画一个简单的花瓣形
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function initPetals() {
            petals = Array.from({ length: 50 }, () => new Petal());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function startPetals() {
            if (petals.length === 0) {
                initPetals();
                animate();
            }
        }
    </script>
</body>
</html>
